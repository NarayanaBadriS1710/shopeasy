{% extends 'store/base.html' %}

{% block content %}
<div style="background: white; max-width: 400px; margin: 80px auto; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 10px;">🔐 Login to ShopEasy</h2>
    <p style="text-align: center; color: #888; margin-bottom: 20px;">Enter your email to receive an OTP</p>

    {% if error %}
        <p style="color: red; text-align: center;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Enter your email" required
               style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:5px; font-size:15px;">
        <button type="submit" class="btn" style="width:100%; padding:12px; font-size:16px;">
            Send OTP 📧
        </button>
    </form>
</div>
{% endblock %}
