{% extends 'store/base.html' %}

{% block content %}
<div style="background: white; max-width: 400px; margin: 50px auto; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h2 style="margin-bottom: 20px; text-align: center;">Create Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
